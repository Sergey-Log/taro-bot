version: '3.8'

services:
  tarot-bot:
    build: .
    container_name: tarot-bot
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      # Сохранение базы данных между перезапусками
      - tarot_data:/app/data
      # Логи (опционально)
      - ./logs:/app/logs
    networks:
      - tarot-network

volumes:
  tarot_data:
    name: tarot_bot_database

networks:
  tarot-network:
    driver: bridge